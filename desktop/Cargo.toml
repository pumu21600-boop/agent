[package]
name = "agent-desktop"
version = "0.1.0"
edition = "2021"
description = "Agent 桌面壳（P13）：窗口 + 托盘 + 服务保活，WebView 加载本机服务"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"

[profile.release]
strip = true
