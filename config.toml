# 施工单 001 配置
# base_url 从本文件读；也可用环境变量 DEEPSEEK_BASE_URL 覆盖（商汤中转等渠道，不用改代码）

[server]
host = "127.0.0.1"
port = 8321

[gateway]
# DeepSeek 官方渠道
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
# 换商汤中转示例（按实际渠道地址填写，形如 OpenAI 兼容的 /chat/completions 前缀）：
# base_url = "https://<商汤中转域名>/v1"

[logging]
dir = "logs"
file = "agent.jsonl"

[agent]
# 核心循环（施工单 003）
max_steps = 8
tool_result_max_chars = 8000
# 审批默认档：suggest / auto-edit / full-auto / local（前端可即时切换，这里是初始值）
default_approval = "auto-edit"
# 本机直跑总开关：true 后前端才允许切「本机直跑」档（脱沙箱=完整用户权限，命令继承你的全部环境）
allow_unsandboxed = true
# 本机直跑档下，执行类命令是否仍要审批（false=连审批一起跳过，最大自由）
unsandboxed_approval = false
