# 施工单 001 配置
# base_url 从本文件读；也可用环境变量 DEEPSEEK_BASE_URL 覆盖（商汤中转等渠道，不用改代码）

[server]
host = "127.0.0.1"
port = 8321

[gateway]
# DeepSeek 官方渠道
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
# 换商汤中转示例（按实际渠道地址填写，形如 OpenAI 兼容的 /chat/completions 前缀）：
# base_url = "https://<商汤中转域名>/v1"

[logging]
dir = "logs"
file = "agent.jsonl"
