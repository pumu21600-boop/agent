[package]
name = "agent"
version = "0.1.0"
edition = "2024"
description = "跑在 Windows 上的类 Codex 自主编码 Agent —— 施工单 001：日志地基 + 网关冒烟 + 取消按钮"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
# DSH 式侧边栏「添加项目」：Win 原生 IFileDialog 选文件夹（server 本地进程弹原生窗口）
rfd = "0.15"
# P11 WASM 插件宿主（总架构 §7：自带沙箱即边界；wat feature 支持文本格式插件，零工具链依赖）
wasmtime = "24"
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
] }
