<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>用量</title>
<style>
  /* 主题变量：浅色靠 body.light 整体切换（此前写 .light body 永远匹配不上——
     主题类切在 body 自己身上，面板一直没真正换过肤，用户实锤） */
  :root { color-scheme: dark; }
  body {
    --bg: #17171a; --fg: #e8e8ea; --dim: #9a9aa2; --line: #2c2c31;
    --hover: #26262b; --btn-line: #3a3a41; --warn: #e8a33d;
    --err: #e5534b; --link: #6ea8fe;
    color-scheme: dark;
  }
  body.light {
    --bg: #ffffff; --fg: #1a1a1c; --dim: #6b6b74; --line: #e4e4e8;
    --hover: #f2f2f5; --btn-line: #d4d4da; --warn: #b25e09;
    --err: #cf222e; --link: #0b62d0;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 16px 20px;
    font: 13px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  h3 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .row .k { color: var(--dim); }
  .row .v { font-variant-numeric: tabular-nums; text-align: right; }
  .big { font-size: 20px; font-weight: 680; font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); font-size: 12px; }
  .foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .warn { color: var(--warn); font-size: 12px; margin-top: 8px; }
  .empty { color: var(--dim); font-size: 12px; padding: 18px 0; text-align: center; }
  button {
    font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--btn-line); background: transparent; color: var(--fg);
  }
  button:hover { background: var(--hover); }
  .err { color: var(--err); font-size: 12px; white-space: pre-wrap; }
  a { color: var(--link); cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
  <div id="body">
    <div class="empty">读取中…</div>
  </div>

  <div class="foot">
    累计花费（全部会话）<span id="spend">—</span> · 全局上限 <span id="cap">未设置</span> · <a id="toPrices">价格设置 →</a>
  </div>

<script>
// —— 插件契约 v1：等宿主 agent:init 再发请求；agent:request/response 按 id 配对 ——
let seq = 0;
const pending = new Map();
let rate = 7.2;
let currency = 'USD';
let booted = false;

window.addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (d.type === 'agent:init') {
    // 主题跟着宿主走（宿主切主题会重发 init）；但 boot 只跑一次——
    // 重复 init 再 load 一遍会叠加轮询定时器（面板越切越卡）
    document.body.classList.toggle('light', ((d.payload || {}).theme) === 'light');
    if (!booted) {
      booted = true;
      boot();
    }
  }
  if (d.type === 'agent:response') {
    const r = pending.get(d.id);
    if (!r) return;
    pending.delete(d.id);
    d.ok ? r.res(d.result) : r.rej(new Error(String(d.result || '请求失败')));
  }
});

function req(method, params) {
  return new Promise((res, rej) => {
    const id = 'r' + ++seq;
    pending.set(id, { res, rej });
    parent.postMessage({ type: 'agent:request', id, method, params }, '*');
  });
}
parent.postMessage({ type: 'agent:hello' }, '*');

const $ = (id) => document.getElementById(id);
const num = (n) => (n ?? 0).toLocaleString('zh-CN');
function money(usd) {
  const v = usd ?? 0;
  if (currency === 'CNY') return '¥' + (v * rate).toFixed(v * rate < 100 ? 2 : 0);
  if (v > 0 && v < 0.01) return '<$0.01';
  return '$' + v.toFixed(v < 100 ? 4 : 2);
}

async function boot() {
  $('toPrices').onclick = () => { location.href = 'prices.html'; };
  await refresh();
  setInterval(refresh, 5000); // 面板口径轻，5s 轮询足够
}

async function refresh() {
  try {
    const r = await req('usage.session', { group: 'model', range: 'all' });
    currency = r.currency || 'USD';
    rate = r.usd_cny_rate || 7.2;
    // 圆环同源的当前上下文占用（旧版宿主没有这路 RPC 时隐藏该行，不影响其余卡片）
    let ctx = null;
    try { ctx = await req('session.usage', {}); } catch (e) { ctx = null; }
    render(r, ctx);
  } catch (e) {
    $('body').innerHTML = `<div class="err">${String(e.message || e).replace(/</g, '&lt;')}</div>`;
  }
}

function render(r, ctx) {
  const t = r.totals || {};
  $('spend').textContent = money(r.spend_total_usd);
  $('cap').textContent = r.spend_cap_usd > 0 ? money(r.spend_cap_usd) : '不限';
  if (!t.requests) {
    $('body').innerHTML = '<div class="empty">本次对话还没有模型调用。</div>';
    return;
  }
  // 当前上下文 = 模型窗口此刻的占用（= 输入框旁圆环：渠道实报锚点 + 之后的上下文增减，
  // 答的是"下一次请求多大"）；输入 token 是各次请求的累计流量，一个是快照一个是累计，
  // 两个数本来就不相等。字段名：projected/window（旧宿主给 tokens/budget，按 ?? 兜底）
  const wan = (n) => (n >= 10000 ? num(Math.round(n / 10000)) + '万' : num(n));
  const ctxUsed = ctx ? (ctx.projected ?? ctx.tokens) : undefined;
  const ctxWindow = ctx ? (ctx.window ?? ctx.budget) : undefined;
  const ctxRow =
    ctx && ctxWindow > 0
      ? `<div class="row" title="模型窗口此刻的占用（= 输入框旁圆环：最近一次渠道实报 + 其后的上下文增减，裁剪会当场回落）。「输入 token」是各次请求的累计，一个是窗口快照、一个是累计流量。"><span class="k">当前上下文（= 圆环）</span><span class="v">${num(
          ctxUsed
        )} / ${wan(ctxWindow)}</span></div>`
      : '';
  $('body').innerHTML = `
    <div class="card">
      <div class="row"><span class="k" title="各次请求的输入合计（计费口径）">输入 token（累计）</span><span class="v big">${num(t.prompt_tokens)}<span class="dim">（缓存命中 ${num(t.cached_tokens)}）</span></span></div>
      ${ctxRow}
      <div class="row"><span class="k">输出 token</span><span class="v big">${num(t.completion_tokens)}</span></div>
      <div class="row"><span class="k">请求次数（失败）</span><span class="v">${num(t.requests)}（${num(t.errors)}）</span></div>
      <div class="row"><span class="k">本次对话费用</span><span class="v big">${money(t.cost_usd)}</span></div>
    </div>
    ${r.priced ? '' : '<div class="warn">有请求未计价（去价格设置补一行）</div>'}`;
}
</script>
</body>
</html>
