<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>css-ui工具</title>
<style>
  :root { scrollbar-color: var(--line2, #3a3e49) transparent; color-scheme: dark; }
  body {
    --bg: #17171a; --fg: #e8e8ea; --dim: #9a9aa2; --line: #2c2c31;
    --hover: #26262b; --btn-line: #3a3a41; --warn: #e8a33d; --err: #e5534b; --ok: #7bc96f;
    color-scheme: dark;
  }
  body.light {
    scrollbar-color: var(--line2, #b3bac4) transparent;
    --bg: #ffffff; --fg: #1a1a1c; --dim: #6b6b74; --line: #e4e4e8;
    --hover: #f2f2f5; --btn-line: #d4d4da; --warn: #b25e09; --err: #cf222e; --ok: #1a7f37;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 16px 20px; font: 13px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h3 { margin: 0 0 8px; font-size: 14px; font-weight: 650; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  .dim { color: var(--dim); font-size: 12px; }
  .err { color: var(--err); font-size: 12px; white-space: pre-wrap; }
  .sw { position: relative; width: 34px; height: 19px; flex: none; border-radius: 999px; border: 1px solid var(--btn-line); background: transparent; cursor: pointer; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--dim); transition: transform .12s, background .12s; }
  .sw.on { background: var(--ok); border-color: var(--ok); }
  .sw.on::after { transform: translateX(15px); background: #fff; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--btn-line); background: transparent; color: var(--fg); }
  button:hover { background: var(--hover); }
  .why { border-left: 2px solid var(--warn); padding: 6px 10px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <div id="body"><div class="empty">读取中…</div></div>

<script>
let seq = 0;
const pending = new Map();
let booted = false;
window.addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (d.type === 'agent:init') {
    document.body.classList.toggle('light', ((d.payload || {}).theme) === 'light');
    if (!booted) { booted = true; boot(); }
  }
  if (d.type === 'agent:response') {
    const r = pending.get(d.id);
    if (!r) return;
    pending.delete(d.id);
    d.ok ? r.res(d.result) : r.rej(new Error(String(d.result || '请求失败')));
  }
});
function req(method, params) {
  return new Promise((res, rej) => {
    const id = 'r' + ++seq;
    pending.set(id, { res, rej });
    parent.postMessage({ type: 'agent:request', id, method, params }, '*');
    // 2026-10-08 修：宿主不响应（agent:response 丢失/被早退）时 Promise 永久
    // pending——面板卡在「读取中…」且无重试无提示，pending 条目也永不清理。
    // 补 8s 超时（与 board/trace 同一范式）。
    setTimeout(() => {
      if (pending.has(id)) {
        pending.delete(id);
        rej(new Error('宿主未响应（超时）'));
      }
    }, 8000);
  });
}
parent.postMessage({ type: 'agent:hello' }, '*');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function boot() { await refresh(); }
async function refresh() {
  try {
    const s = await req('features.get', {});
    render(s);
  } catch (e) { $('body').innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
}
function render(s) {
  const on = (s.features || {}).css_tool !== false;
  $('body').innerHTML = `
    <h3>css-ui工具</h3>
    <div class="card">
      <div class="row"><span>启用工具</span><button id="sw" class="sw ${on ? 'on' : ''}" aria-label="启用/停用"></button></div>
      <div class="dim">开：右键元素可改样式，也可以直接让 agent 调这个界面。关：只收工具入口，已调好的样式继续生效，重开即恢复。</div>
    </div>
    <div class="why">为什么工具本身不住在这个面板里：插件的规矩是不透明源——碰不到宿主的界面，这正是隔离的目的。注入动作必须由宿主侧执行，所以这里只管开关和说明。</div>`;
  $('sw').onclick = async () => {
    try {
      const r = await req('features.set', { feature: 'css_tool', value: !on });
      render({ ...s, features: r.features });
    } catch (e) { alert('切换失败：' + (e.message || e)); }
  };
}
</script>
</body>
</html>
