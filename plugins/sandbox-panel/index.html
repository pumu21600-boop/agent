<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>沙箱</title>
<style>
  :root { scrollbar-color: var(--line2, #3a3e49) transparent; color-scheme: dark; }
  body {
    --bg: #17171a; --fg: #e8e8ea; --dim: #9a9aa2; --line: #2c2c31;
    --hover: #26262b; --btn-line: #3a3a41; --warn: #e8a33d; --err: #e5534b; --ok: #7bc96f;
    color-scheme: dark;
  }
  body.light {
    scrollbar-color: var(--line2, #b3bac4) transparent;
    --bg: #ffffff; --fg: #1a1a1c; --dim: #6b6b74; --line: #e4e4e8;
    --hover: #f2f2f5; --btn-line: #d4d4da; --warn: #b25e09; --err: #cf222e; --ok: #1a7f37;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 16px 20px; font: 13px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h3 { margin: 0 0 8px; font-size: 14px; font-weight: 650; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .row .k { color: var(--dim); }
  .row .v { text-align: right; word-break: break-all; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--btn-line); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--btn-line); background: transparent; color: var(--fg); }
  button:hover { background: var(--hover); }
  .dim { color: var(--dim); font-size: 12px; }
  .err { color: var(--err); font-size: 12px; white-space: pre-wrap; }
  .empty { color: var(--dim); font-size: 12px; padding: 18px 0; text-align: center; }
  .probe { font-size: 12px; padding: 2px 0; display: flex; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--dim); }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--err); }
  .cpu { display: flex; align-items: center; gap: 8px; padding-top: 8px; }
  .cpu input { width: 64px; padding: 4px 6px; font: inherit; border: 1px solid var(--btn-line); border-radius: 6px; background: var(--bg); color: var(--fg); text-align: right; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
  <div id="body"><div class="empty">读取中…</div></div>
  <div class="btns"><button id="detect">重新检测</button><button id="probe">跑自检</button></div>

<script>
let seq = 0;
const pending = new Map();
let booted = false;
window.addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (d.type === 'agent:init') {
    document.body.classList.toggle('light', ((d.payload || {}).theme) === 'light');
    if (!booted) { booted = true; boot(); }
  }
  if (d.type === 'agent:response') {
    const r = pending.get(d.id);
    if (!r) return;
    pending.delete(d.id);
    d.ok ? r.res(d.result) : r.rej(new Error(String(d.result || '请求失败')));
  }
});
function req(method, params) {
  return new Promise((res, rej) => {
    const id = 'r' + ++seq;
    pending.set(id, { res, rej });
    parent.postMessage({ type: 'agent:request', id, method, params }, '*');
  });
}
parent.postMessage({ type: 'agent:hello' }, '*');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function boot() {
  $('detect').onclick = async () => { try { render(await req('action.run', { action: 'sandbox.detect' })); } catch (e) { $('body').innerHTML = `<div class="err">${esc(e.message || e)}</div>`; } };
  $('probe').onclick = async () => {
    $('probe').disabled = true;
    try { const r = await req('action.run', { action: 'sandbox.probe' }); renderProbe(r.probe); } catch (e) { $('body').insertAdjacentHTML('beforeend', `<div class="err">${esc(e.message || e)}</div>`); }
    $('probe').disabled = false;
  };
  await refresh();
}
async function refresh() {
  try {
    const s = await req('features.get', {});
    render(s);
  } catch (e) { $('body').innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
}
function render(s) {
  const sb = s.sandbox;
  if (!sb) { $('body').innerHTML = '<div class="empty">宿主还没读到沙箱状态，点「重新检测」。</div>'; return; }
  $('body').innerHTML = `
    <h3>沙箱</h3>
    <div class="card">
      <div class="row"><span class="k">命令在受限进程树里跑</span><span class="v">${sb.fallback_reason ? '<span class="chip warn">已回退</span>' : '是'}</span></div>
      <div class="row"><span class="k">生效档</span><span class="v">${esc(sb.effective || '—')}</span></div>
      <div class="row"><span class="k">配置档</span><span class="v">${esc(sb.mode_configured || '—')}${sb.effective !== sb.requested ? '（请求的档不可用，已回退）' : ''}</span></div>
      <div class="row"><span class="k">直跑开关（完全访问）</span><span class="v">${sb.allow_unsandboxed ? '开' : '关'}</span></div>
      ${sb.fallback_reason ? `<div class="row"><span class="k">回退原因</span><span class="v err">${esc(sb.fallback_reason)}</span></div>` : ''}
      <div class="cpu">
        <span class="k dim">CPU 上限（单核 %，0 = 不限）</span>
        <input id="cpu" type="number" min="0" max="100" value="${Number(s.sandbox_cpu_percent ?? 80)}" />
        <button id="saveCpu">保存</button>
      </div>
    </div>
    <div class="dim">审批档在输入框旁边切（只读/沙箱/自动/完全访问）；这道墙的执法归内核，插件只看状态、调上限。</div>
    <div id="probe-out"></div>`;
  $('saveCpu').onclick = async () => {
    try {
      await req('settings.feature.save', { sandbox_cpu_percent: Number($('cpu').value) });
      $('cpu').style.borderColor = 'var(--ok)';
      setTimeout(() => { if ($('cpu')) $('cpu').style.borderColor = ''; }, 1200);
    } catch (e) { alert('保存失败：' + (e.message || e)); }
  };
}
function renderProbe(probe) {
  if (!probe) return;
  const rows = (probe.results || []).map((p) => `<div class="probe"><span class="dot ${p.ok ? 'ok' : 'bad'}"></span><code>${esc(p.name)}</code><span class="dim">${esc(p.detail || '')}</span></div>`).join('');
  $('probe-out').innerHTML = `
    <div class="card" style="margin-top:10px">
      <div class="row"><span class="k">自检</span><span class="v">${probe.ok ? '<span class="chip" style="color:var(--ok);border-color:var(--ok)">通过</span>' : '<span class="chip warn">有失败</span>'}</span></div>
      ${rows || '<div class="dim">没有探针结果</div>'}
      ${probe.error ? `<div class="err">${esc(probe.error)}</div>` : ''}
    </div>`;
}
</script>
</body>
</html>
