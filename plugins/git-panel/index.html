<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Git</title>
<style>
  :root { scrollbar-color: var(--line2, #3a3e49) transparent; color-scheme: dark; }
  body {
    --bg: #17171a; --fg: #e8e8ea; --dim: #9a9aa2; --line: #2c2c31;
    --hover: #26262b; --btn-line: #3a3a41; --warn: #e8a33d; --err: #e5534b; --link: #6ea8fe; --ok: #7bc96f;
    color-scheme: dark;
  }
  body.light {
    scrollbar-color: var(--line2, #b3bac4) transparent;
    --bg: #ffffff; --fg: #1a1a1c; --dim: #6b6b74; --line: #e4e4e8;
    --hover: #f2f2f5; --btn-line: #d4d4da; --warn: #b25e09; --err: #cf222e; --link: #0b62d0; --ok: #1a7f37;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 16px 20px; font: 13px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h3 { margin: 0 0 8px; font-size: 14px; font-weight: 650; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .row .k { color: var(--dim); }
  .row .v { text-align: right; word-break: break-all; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--btn-line); }
  .chip.ok { color: var(--ok); border-color: var(--ok); }
  .chip.bad { color: var(--err); border-color: var(--err); }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--btn-line); background: transparent; color: var(--fg); }
  button:hover { background: var(--hover); }
  .dim { color: var(--dim); font-size: 12px; }
  .err { color: var(--err); font-size: 12px; white-space: pre-wrap; }
  .empty { color: var(--dim); font-size: 12px; padding: 18px 0; text-align: center; }
</style>
</head>
<body>
  <div id="body"><div class="empty">读取中…</div></div>
  <div style="margin-top:10px"><button id="detect">重新检测</button></div>

<script>
let seq = 0;
const pending = new Map();
let booted = false;
window.addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (d.type === 'agent:init') {
    document.body.classList.toggle('light', ((d.payload || {}).theme) === 'light');
    if (!booted) { booted = true; boot(); }
  }
  if (d.type === 'agent:response') {
    const r = pending.get(d.id);
    if (!r) return;
    pending.delete(d.id);
    d.ok ? r.res(d.result) : r.rej(new Error(String(d.result || '请求失败')));
  }
});
function req(method, params) {
  return new Promise((res, rej) => {
    const id = 'r' + ++seq;
    pending.set(id, { res, rej });
    parent.postMessage({ type: 'agent:request', id, method, params }, '*');
  });
}
parent.postMessage({ type: 'agent:hello' }, '*');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function boot() {
  $('detect').onclick = async () => {
    $('detect').disabled = true;
    try { render(await req('action.run', { action: 'git.detect' })); } catch (e) { $('body').innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
    $('detect').disabled = false;
  };
  await refresh();
}
async function refresh() {
  try {
    const s = await req('features.get', {});
    render(s.git);
  } catch (e) { $('body').innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
}
function render(git) {
  if (!git) { $('body').innerHTML = '<div class="empty">宿主还没有读到 Git 运行时状态，点「重新检测」。</div>'; return; }
  $('body').innerHTML = `
    <h3>Git 运行时</h3>
    <div class="card">
      <div class="row"><span class="k">状态</span><span class="v">${git.ok ? '<span class="chip ok">可用</span>' : '<span class="chip bad">不可用</span>'}</span></div>
      ${git.version ? `<div class="row"><span class="k">版本</span><span class="v">${esc(git.version)}</span></div>` : ''}
      <div class="row"><span class="k">来源</span><span class="v">${esc(git.source === 'system' ? '系统 Git' : git.source === 'portable' ? '便携版' : git.source === 'builtin' ? '内置' : git.source || '—')}</span></div>
      ${git.path ? `<div class="row"><span class="k">路径</span><span class="v">${esc(git.path)}</span></div>` : ''}
      ${git.error ? `<div class="row"><span class="k">原因</span><span class="v err">${esc(git.error)}</span></div>` : ''}
    </div>
    <div class="dim">提交信息的约定与流程见「git-commit」技能（在「/」菜单里引用它提问或让它提交）。</div>`;
}
</script>
</body>
</html>
