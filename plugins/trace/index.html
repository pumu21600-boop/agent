<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>时间线 · 最近任务</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #17181c;
        color: #d8dbe2;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #e8ebf2;
        flex: 1;
      }
      button {
        padding: 5px 12px;
        border-radius: 7px;
        border: 1px solid #2c2f38;
        background: transparent;
        color: #b9bfca;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        color: #fff;
        border-color: #3a3e49;
      }
      .empty {
        color: #858b98;
        font-size: 13px;
        text-align: center;
        padding: 24px 0;
      }
      .note {
        font-size: 12px;
        color: #e8d47f;
        background: #3a3417;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 10px;
      }
      .task {
        border: 1px solid #2c2f38;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .task-head {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: #1c1e24;
        border: none;
        color: #e8ebf2;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
        text-align: left;
      }
      .task-head:hover {
        background: #22242c;
      }
      .idx {
        color: #9fd0ff;
        font-weight: 600;
      }
      .time {
        font-variant-numeric: tabular-nums;
      }
      .meta {
        color: #858b98;
        font-size: 12px;
        flex: 1;
      }
      .caret {
        transition: transform 0.15s;
      }
      .caret.open {
        transform: rotate(90deg);
      }
      .events {
        display: flex;
        flex-direction: column;
        padding: 6px 10px 10px;
        max-height: 52vh;
        overflow-y: auto;
      }
      .ev {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 3px 0;
        border-bottom: 1px dashed #22242c;
        font-size: 12px;
        color: #b9bfca;
      }
      .ev:last-child {
        border-bottom: none;
      }
      .offset {
        color: #858b98;
        font-variant-numeric: tabular-nums;
        min-width: 52px;
        text-align: right;
      }
      .badge {
        min-width: 78px;
        text-align: center;
        border-radius: 4px;
        padding: 0 4px;
        font-size: 11px;
      }
      .b-st {
        background: #1e2a3d;
        color: #9fd0ff;
      }
      .b-call {
        background: #16301f;
        color: #7fd6a4;
      }
      .b-res {
        background: #1c1e24;
        color: #7fd6a4;
      }
      .b-fail {
        background: #3d1e1e;
        color: #ff9b9b;
      }
      .b-chunk {
        background: #2c2f38;
        color: #b9bfca;
      }
      .b-th {
        background: #1e2a3d;
        color: #9fd0ff;
      }
      .b-err {
        background: #3d1e1e;
        color: #ff9b9b;
      }
      .sum {
        flex: 1;
        word-break: break-all;
      }
      .pair {
        color: #e8d47f;
        font-variant-numeric: tabular-nums;
      }
      .folded {
        margin-top: 6px;
        font-size: 12px;
        color: #858b98;
        border-top: 1px solid #24272f;
        padding-top: 6px;
      }
    </style>
  </head>
  <body>
    <!--
      时间线面板（P19 契约试点）：原内置 trace 弹窗顺势插件化。数据经宿主只读桥
      trace.recent 拉取（iframe 是不透明源，fetch 不到 /api）。
    -->
    <div class="head">
      <h2>时间线 · 最近任务</h2>
      <button id="refresh" title="刷新">↻ 刷新</button>
    </div>
    <div id="body" class="empty">加载中…</div>

    <script>
      const pending = new Map();
      let seq = 0;
      // 展开态按 start_ts 认，不按数组下标：刷新后新任务会把索引整体挤位，按下标会把
      // 「展开着的那个任务」悄悄换成另一个；时间戳是任务的稳定身份。
      let expandedTs = null;
      let last = null; // 最近一次数据（展开切换时不重拉）

      function call(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++seq;
          pending.set(id, { resolve, reject });
          parent.postMessage({ type: 'agent:request', id, method, params }, '*');
          setTimeout(() => {
            if (pending.has(id)) {
              pending.delete(id);
              reject(new Error('桥调用超时'));
            }
          }, 10000);
        });
      }
      window.addEventListener('message', (ev) => {
        const d = ev.data || {};
        // agent:init = 宿主已登记本 frame（load 事件后），此刻起桥调用才会被受理——
        // 初始拉数据必须挂在这里，脚本一跑就调用会因未登记被宿主丢弃（真机踩过）。
        if (d.type === 'agent:init') {
          load();
          return;
        }
        if (d.type === 'agent:response' && pending.has(d.id)) {
          const { resolve, reject } = pending.get(d.id);
          pending.delete(d.id);
          d.ok ? resolve(d.result) : reject(new Error(String(d.result || '桥调用失败')));
        }
      });
      parent.postMessage({ type: 'agent:hello' }, '*');

      // —— 内部 plumbing 事件：会话存储 / 网关握手 / 沙箱 spawn / 检查点跳过这类对
      // 「任务发生了什么」没有信息量（一次「你好」就能刷出 14 条），折叠成一行计数——
      // 但数量照实报，不许静默吞。未列入的 state kind 一律仍然展示。
      const PLUMBING_KINDS = new Set([
        'storage.write',
        'session.saved',
        'gateway.request',
        'gateway.response',
        'gateway.stream_end',
        'gateway.max_tokens_inflated',
        'sandbox.spawn',
        'sandbox.exit',
        'sandbox.tier.resolved',
        'tools.parallel',
        'checkpoint.skipped',
      ]);
      function isPlumbing(ev) {
        return ev.etype === 'state' && PLUMBING_KINDS.has((ev.payload || {}).kind);
      }

      // 事件摘要（一行）：按类型提取可读文本
      function summary(ev) {
        const p = ev.payload || {};
        switch (ev.etype) {
          case 'state': return p.kind || JSON.stringify(p).slice(0, 90);
          case 'tool_call': return `${p.name}  ${String(p.arguments || '').slice(0, 90)}`;
          case 'tool_result': return `${p.ok ? '[成功] ' : '[失败] '}${String(p.preview || '').slice(0, 90)}`;
          case 'model_chunk': return p.aggregated ? `${p.count} 个模型流式分片（聚合展示）` : '模型分片';
          case 'thought': return String(p.text || '').slice(0, 90);
          case 'error': return String(p.message || p.error || JSON.stringify(p)).slice(0, 90);
          default: return JSON.stringify(p).slice(0, 90);
        }
      }
      // tool_call → tool_result 配对耗时（毫秒）。
      // **先按 id 配**：并行工具调用（tools.parallel）一次发出多个调用，各带不同 id，
      // 旧实现「遇下一个 tool_call 就放弃」会把第一个调用的耗时整个丢掉（真机日志实锤：
      // read_skill 与 shell 并行发出，read_skill 的耗时配不上）。id 缺失的老日志回落按
      // name 排 FIFO。返回 Map：tool_call 的事件下标 → 耗时。
      function pairDurations(events) {
        const out = new Map();
        const byId = new Map(); // call id → { i, offset }
        const byName = new Map(); // name → [{ i, offset }]（FIFO）
        events.forEach((ev, i) => {
          const p = ev.payload || {};
          if (ev.etype === 'tool_call') {
            if (p.id) byId.set(p.id, { i, offset: ev.offset_ms });
            const q = byName.get(p.name) || [];
            q.push({ i, offset: ev.offset_ms });
            byName.set(p.name, q);
          } else if (ev.etype === 'tool_result') {
            let hit = null;
            if (p.id && byId.has(p.id)) {
              hit = byId.get(p.id);
              byId.delete(p.id);
              // 同名 FIFO 队列里同步剔掉这条，避免回落匹配时串到别的调用
              byName.set(p.name, (byName.get(p.name) || []).filter((c) => c.i !== hit.i));
            } else {
              const q = byName.get(p.name) || [];
              hit = q.length ? q.shift() : null;
            }
            if (hit) out.set(hit.i, ev.offset_ms - hit.offset);
          }
        });
        return out;
      }
      function badge(ev) {
        return { state: 'st', tool_call: 'call', tool_result: (ev.payload?.ok === false ? 'fail' : 'res'), model_chunk: 'chunk', thought: 'th', error: 'err' }[ev.etype] || 'st';
      }
      function fmtClock(ts) {
        const d = new Date(ts);
        if (isNaN(d)) return ts;
        const hm = d.toLocaleTimeString('zh-CN', { hour12: false });
        // 跨天任务只显示时分秒会和今天的任务混在一起（最近任务常跨天），补日期
        return d.toDateString() === new Date().toDateString() ? hm : `${d.getMonth() + 1}-${d.getDate()} ${hm}`;
      }
      function fmtDur(ms) {
        return ms >= 1000 ? `${(ms / 1000).toFixed(1)}s` : `${ms}ms`;
      }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      }
      // payload 原样进 title 属性会整个进 DOM：gateway.request 一条 payload 就 10KB+
      // （整段请求体，长会话里更大），全量展开一个任务往页面里灌几十 KB。截断到 1KB，
      // 尾部标省略——展开只为快速看一眼，完整数据在 logs/agent.jsonl。
      function tip(ev) {
        const s = JSON.stringify(ev.payload);
        return s.length > 1000 ? s.slice(0, 1000) + ' …（已截断，完整见 logs/agent.jsonl）' : s;
      }

      function render(data) {
        const body = document.getElementById('body');
        const tasks = data.tasks || [];
        const note = data.note || '';
        if (!tasks.length) {
          body.className = 'empty';
          body.textContent = note || '当前工作区还没有任务记录（跑一次对话后这里会出现事件流）';
          return;
        }
        let html = note ? `<div class="note">${esc(note)}</div>` : '';
        tasks.forEach((task, ti) => {
          // 后端倒序返回（最新在前）：最新任务 = #1
          const open = expandedTs === task.start_ts;
          const vis = task.events.map((ev, ei) => ({ ev, ei })).filter((x) => !isPlumbing(x.ev));
          const hidden = task.events.length - vis.length;
          const pairs = open ? pairDurations(task.events) : null;
          html += `<div class="task"><button class="task-head" data-ts="${esc(task.start_ts)}">
            <span class="idx">#${ti + 1}</span>
            <span class="time">${esc(fmtClock(task.start_ts))}</span>
            <span class="meta">${esc(fmtDur(task.duration_ms))} · ${vis.length} 事件${hidden ? ` · 折叠 ${hidden}` : ''}</span>
            <svg class="caret${open ? ' open' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="m9 6 6 6-6 6"/></svg>
          </button>`;
          if (open) {
            html += '<div class="events">';
            vis.forEach(({ ev, ei }) => {
              const ms = pairs.get(ei);
              html += `<div class="ev">
                <span class="offset">${(ev.offset_ms / 1000).toFixed(1)}s</span>
                <span class="badge b-${badge(ev)}">${esc(ev.etype)}</span>
                <span class="sum" title="${esc(tip(ev))}">${esc(summary(ev))}</span>
                ${ms !== undefined ? `<span class="pair">${esc(fmtDur(ms))}</span>` : ''}
              </div>`;
            });
            if (hidden) {
              html += `<div class="folded">另有 ${hidden} 条内部事件已折叠（会话存储 / 网关握手 / 沙箱 spawn / 检查点跳过等，logs/agent.jsonl 里有全量）</div>`;
            }
            html += '</div>';
          }
          html += '</div>';
        });
        body.className = '';
        body.innerHTML = html;
        body.querySelectorAll('.task-head').forEach((el) => {
          el.onclick = () => {
            const ts = el.dataset.ts;
            expandedTs = expandedTs === ts ? null : ts;
            render(last);
          };
        });
      }

      async function load() {
        const body = document.getElementById('body');
        body.className = 'empty';
        body.textContent = '加载中…';
        try {
          last = await call('trace.recent', { limit: 10 });
          render(last);
        } catch (e) {
          body.className = 'empty';
          body.textContent = `读取失败: ${e.message || e}`;
        }
      }
      document.getElementById('refresh').onclick = load;
    </script>
  </body>
</html>
