<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>时间线 · 最近任务</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #17181c;
        color: #d8dbe2;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #e8ebf2;
        flex: 1;
      }
      button {
        padding: 5px 12px;
        border-radius: 7px;
        border: 1px solid #2c2f38;
        background: transparent;
        color: #b9bfca;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        color: #fff;
        border-color: #3a3e49;
      }
      .empty {
        color: #858b98;
        font-size: 13px;
        text-align: center;
        padding: 24px 0;
      }
      .note {
        font-size: 12px;
        color: #e8d47f;
        background: #3a3417;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 10px;
      }
      .task {
        border: 1px solid #2c2f38;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .task-head {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: #1c1e24;
        border: none;
        color: #e8ebf2;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
        text-align: left;
      }
      .task-head:hover {
        background: #22242c;
      }
      .idx {
        color: #9fd0ff;
        font-weight: 600;
      }
      .time {
        font-variant-numeric: tabular-nums;
      }
      .meta {
        color: #858b98;
        font-size: 12px;
        flex: 1;
      }
      .caret {
        transition: transform 0.15s;
      }
      .caret.open {
        transform: rotate(90deg);
      }
      .events {
        display: flex;
        flex-direction: column;
        padding: 6px 10px 10px;
        max-height: 52vh;
        overflow-y: auto;
      }
      .ev {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 3px 0;
        border-bottom: 1px dashed #22242c;
        font-size: 12px;
        color: #b9bfca;
      }
      .ev:last-child {
        border-bottom: none;
      }
      .offset {
        color: #858b98;
        font-variant-numeric: tabular-nums;
        min-width: 52px;
        text-align: right;
      }
      .badge {
        min-width: 78px;
        text-align: center;
        border-radius: 4px;
        padding: 0 4px;
        font-size: 11px;
      }
      .b-st {
        background: #1e2a3d;
        color: #9fd0ff;
      }
      .b-call {
        background: #16301f;
        color: #7fd6a4;
      }
      .b-res {
        background: #1c1e24;
        color: #7fd6a4;
      }
      .b-fail {
        background: #3d1e1e;
        color: #ff9b9b;
      }
      .b-chunk {
        background: #2c2f38;
        color: #b9bfca;
      }
      .b-th {
        background: #1e2a3d;
        color: #9fd0ff;
      }
      .b-err {
        background: #3d1e1e;
        color: #ff9b9b;
      }
      .sum {
        flex: 1;
        word-break: break-all;
      }
      .pair {
        color: #e8d47f;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <!--
      时间线面板（P19 契约试点）：原内置 trace 弹窗顺势插件化。数据经宿主只读桥
      trace.recent 拉取（iframe 是不透明源，fetch 不到 /api）。
    -->
    <div class="head">
      <h2>时间线 · 最近任务</h2>
      <button id="refresh" title="刷新">↻ 刷新</button>
    </div>
    <div id="body" class="empty">加载中…</div>

    <script>
      const pending = new Map();
      let seq = 0;
      let expanded = null; // 当前展开的任务索引（一次一个）
      let last = null; // 最近一次数据（展开切换时不重拉）

      function call(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++seq;
          pending.set(id, { resolve, reject });
          parent.postMessage({ type: 'agent:request', id, method, params }, '*');
          setTimeout(() => {
            if (pending.has(id)) {
              pending.delete(id);
              reject(new Error('桥调用超时'));
            }
          }, 10000);
        });
      }
      window.addEventListener('message', (ev) => {
        const d = ev.data || {};
        // agent:init = 宿主已登记本 frame（load 事件后），此刻起桥调用才会被受理——
        // 初始拉数据必须挂在这里，脚本一跑就调用会因未登记被宿主丢弃（真机踩过）。
        if (d.type === 'agent:init') {
          load();
          return;
        }
        if (d.type === 'agent:response' && pending.has(d.id)) {
          const { resolve, reject } = pending.get(d.id);
          pending.delete(d.id);
          d.ok ? resolve(d.result) : reject(new Error(String(d.result || '桥调用失败')));
        }
      });
      parent.postMessage({ type: 'agent:hello' }, '*');

      // 事件摘要（一行）：按类型提取可读文本
      function summary(ev) {
        const p = ev.payload || {};
        switch (ev.etype) {
          case 'state': return p.kind || JSON.stringify(p).slice(0, 90);
          case 'tool_call': return `${p.name}  ${String(p.arguments || '').slice(0, 90)}`;
          case 'tool_result': return `${p.ok ? '[成功] ' : '[失败] '}${String(p.preview || '').slice(0, 90)}`;
          case 'model_chunk': return p.aggregated ? `${p.count} 个模型流式分片（聚合展示）` : '模型分片';
          case 'thought': return String(p.text || '').slice(0, 90);
          case 'error': return String(p.message || p.error || JSON.stringify(p)).slice(0, 90);
          default: return JSON.stringify(p).slice(0, 90);
        }
      }
      // tool_call → 后续同名 tool_result 配对耗时（毫秒；配不上返回 null）
      function pairMs(events, i) {
        const c = events[i];
        if (!c || c.etype !== 'tool_call') return null;
        for (let j = i + 1; j < events.length; j++) {
          const r = events[j];
          if (r.etype === 'tool_result' && r.payload?.name === c.payload?.name) {
            return r.offset_ms - c.offset_ms;
          }
          if (r.etype === 'tool_call') return null;
        }
        return null;
      }
      function badge(ev) {
        return { state: 'st', tool_call: 'call', tool_result: (ev.payload?.ok === false ? 'fail' : 'res'), model_chunk: 'chunk', thought: 'th', error: 'err' }[ev.etype] || 'st';
      }
      function fmtClock(ts) {
        const d = new Date(ts);
        return isNaN(d) ? ts : d.toLocaleTimeString('zh-CN', { hour12: false });
      }
      function fmtDur(ms) {
        return ms >= 1000 ? `${(ms / 1000).toFixed(1)}s` : `${ms}ms`;
      }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      }

      function render(data) {
        const body = document.getElementById('body');
        const tasks = data.tasks || [];
        const note = data.note || '';
        if (!tasks.length) {
          body.className = 'empty';
          body.textContent = note || '还没有任务记录（跑一次对话后这里会出现事件流）';
          return;
        }
        let html = note ? `<div class="note">${esc(note)}</div>` : '';
        tasks.forEach((task, ti) => {
          html += `<div class="task"><button class="task-head" data-ti="${ti}">
            <span class="idx">#${tasks.length - ti}</span>
            <span class="time">${esc(fmtClock(task.start_ts))}</span>
            <span class="meta">${esc(fmtDur(task.duration_ms))} · ${task.events.length} 事件</span>
            <svg class="caret${expanded === ti ? ' open' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="m9 6 6 6-6 6"/></svg>
          </button>`;
          if (expanded === ti) {
            html += '<div class="events">';
            task.events.forEach((ev, ei) => {
              const ms = pairMs(task.events, ei);
              html += `<div class="ev">
                <span class="offset">${(ev.offset_ms / 1000).toFixed(1)}s</span>
                <span class="badge b-${badge(ev)}">${esc(ev.etype)}</span>
                <span class="sum" title="${esc(JSON.stringify(ev.payload))}">${esc(summary(ev))}</span>
                ${ms !== null ? `<span class="pair">${esc(fmtDur(ms))}</span>` : ''}
              </div>`;
            });
            html += '</div>';
          }
          html += '</div>';
        });
        body.className = '';
        body.innerHTML = html;
        body.querySelectorAll('.task-head').forEach((el) => {
          el.onclick = () => {
            const ti = Number(el.dataset.ti);
            expanded = expanded === ti ? null : ti;
            render(last);
          };
        });
      }

      async function load() {
        const body = document.getElementById('body');
        body.className = 'empty';
        body.textContent = '加载中…';
        try {
          last = await call('trace.recent', { limit: 10 });
          render(last);
        } catch (e) {
          body.className = 'empty';
          body.textContent = `读取失败: ${e.message || e}`;
        }
      }
      document.getElementById('refresh').onclick = load;
    </script>
  </body>
</html>
